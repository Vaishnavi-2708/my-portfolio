    <meta name="theme-color" content="#faf7ff" />
    <script>
      (() => {
        let theme
        try { theme = localStorage.getItem('portfolio-theme') } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171225' : '#faf7ff'
      })()
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vaishnavi Darla | Senior Agentic AI Engineer" />
    <meta property="og:description" content="Selected work in agentic AI, clinical intelligence, fraud detection, and applied machine learning." />
